# AquaShell Start Menu v0.3
# Target: redesigned Windows 11 Start menu (25H2+)
# Goal: clean macOS-like app launcher
# - pinned apps only
# - no Windows Search box
# - no user profile
# - no power controls
# - no recommendations
# - no category/all-apps pane
# - compact acrylic/glass panel

# Force the redesigned Start menu into the side-by-side layout so the
# All Apps/category pane can be removed cleanly and the pinned pane can
# occupy the whole launcher.
disableNewStartMenuLayout: newLayoutSideBySide

controlStyles:

  # ==========================================================
  # MAIN WINDOW
  # ==========================================================

  - target: Grid#MainMenu
    styles:
      - Visibility=Visible
      - Width=500
      - Background=Transparent
      - CornerRadius=18

  - target: Grid#FrameRoot
    styles:
      - MaxHeight=500


  # ==========================================================
  # REMOVE WINDOWS SEARCH
  # Search already opens the separate Windows Search UI, so AquaShell
  # keeps Start as an app launcher only.
  # ==========================================================

  - target: StartMenu.SearchBoxToggleButton
    styles:
      - Visibility=Collapsed
      - Height=0
      - Width=0

  # Pull the Start content upward so the removed search box doesn't
  # leave an empty strip at the top.
  - target: Border#AcrylicOverlay
    styles:
      - Margin=0,-64,0,0

  - target: Frame#StartFrame
    styles:
      - Margin=0,-64,0,0


  # ==========================================================
  # REMOVE CATEGORY / ALL APPS PANE
  # SideBySide layout: left = All Apps, right = Pinned.
  # Collapse the left pane and let Pinned take the full width.
  # ==========================================================

  - target: Grid#SideBySidePinnedWrapper
    styles:
      - ColumnDefinitions:=<ColumnDefinitionCollection><ColumnDefinition Width="0"/><ColumnDefinition Width="1*"/></ColumnDefinitionCollection>

  - target: GridView#AllAppsGrid > Border > Grid#SideBySidePinnedWrapper > ScrollViewer#ScrollViewer
    styles:
      - Visibility=Collapsed
      - Width=0

  - target: Grid#AllListHeading
    styles:
      - Visibility=Collapsed

  - target: Grid#AllListHeading > Microsoft.UI.Xaml.Controls.DropDownButton#ViewSelectionButton
    styles:
      - Visibility=Collapsed


  # ==========================================================
  # PINNED APPS
  # ==========================================================

  - target: ScrollViewer#SideBySidePinnedScrollViewer
    styles:
      - Grid.Column=1
      - Margin=0

  - target: StartMenu.PinnedList
    styles:
      - Margin=18,14,18,18

  - target: Grid#SideBySidePinnedWrapper > ScrollViewer > Border#Root > Grid > ScrollContentPresenter > ItemsPresenter > ItemsWrapGrid
    styles:
      - Margin=12,8,12,12

  # Hide Windows heading above pinned apps.
  - target: Windows.UI.Xaml.Controls.TextBlock#PinnedListHeaderText
    styles:
      - Visibility=Collapsed


  # ==========================================================
  # REMOVE USER / POWER / FOOTER
  # These controls already live in the YASB macOS-style top bar.
  # ==========================================================

  - target: Grid#NavPanePlaceholder
    styles:
      - Visibility=Collapsed

  - target: StartDocked.NavigationPaneView#NavigationPane
    styles:
      - Visibility=Collapsed

  - target: StartDocked.UserTileView
    styles:
      - Visibility=Collapsed

  - target: StartDocked.PowerOptionsView#PowerButton
    styles:
      - Visibility=Collapsed


  # ==========================================================
  # REMOVE RECOMMENDED / SUGGESTIONS
  # ==========================================================

  - target: GridView#RecommendedList
    styles:
      - Visibility=Collapsed

  - target: Windows.UI.Xaml.Controls.Grid#NoTopLevelSuggestionsText
    styles:
      - Visibility=Collapsed

  - target: Windows.UI.Xaml.Controls.Grid#TopLevelSuggestionsListHeader
    styles:
      - Visibility=Collapsed

  - target: Grid#TopLevelSuggestionsRoot
    styles:
      - Visibility=Collapsed

  - target: Grid#TopLevelSuggestionsRoot > Grid[2]
    styles:
      - MinHeight=0

  - target: Grid#TopLevelHeader > Grid[2] > Button
    styles:
      - Visibility=Collapsed


  # ==========================================================
  # MACOS-LIKE GLASS
  # ==========================================================

  - target: Border#AcrylicBorder
    styles:
      - Background:=<AcrylicBrush TintColor="#1C1C1E" FallbackColor="#E61C1C1E" TintOpacity="0.30" TintLuminosityOpacity="0.68" Opacity="1"/>
      - BorderBrush:=<SolidColorBrush Color="#3DFFFFFF" />
      - BorderThickness=1
      - CornerRadius=18

  - target: Border#AppBorder
    styles:
      - Background:=<AcrylicBrush TintColor="#1C1C1E" FallbackColor="#E61C1C1E" TintOpacity="0.24" TintLuminosityOpacity="0.64" Opacity="1"/>
      - BorderBrush:=<SolidColorBrush Color="#24FFFFFF" />
      - CornerRadius=18

  - target: Border#LayerBorder
    styles:
      - Visibility=Collapsed
